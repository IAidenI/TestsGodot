# Vérifie et formate le GDScript automatiquement avant chaque commit,
# et empêche les commits directs sur main.
# Installation (une fois par personne) :
#   pip install pre-commit "gdtoolkit==4.*"
#   pre-commit install
#   pre-commit autoupdate

repos:
  - repo: https://github.com/Scony/godot-gdscript-toolkit
    rev: 4.5.0
    hooks:
      - id: gdformat   # reformate les .gd
      - id: gdlint     # vérifie le nommage et le style

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]   # bloque les commits directs sur main
